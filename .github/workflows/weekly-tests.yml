name: Weekly Tests

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Full suite including live-network tests against Apple's endpoints
      # (these are skipped on PR CI; see src/__tests__/helpers.ts).
      - name: Run tests (including live network tests)
        run: npm run test:network

