name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Don't let one Node version's failure cancel and mask the others.
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      # Unit tests only. Live-network tests hit Apple's endpoints, which
      # rate-limit shared CI runner IPs (429), so they run on the weekly
      # schedule instead of gating every PR. See src/__tests__/helpers.ts.
      - name: Run unit tests
        run: npm run test:run

      - name: Build package
        run: npm run build
